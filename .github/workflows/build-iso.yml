name: Build and test the NexWM OS ISO

# Whole-build pipeline for the unofficial Ubuntu flavor built around HDE
# (NexWM). Everything runs on hosted runners — nothing ever executes on a
# maintainer's machine: debootstrap the newest LTS base, install and build
# HDE from the pinned NexWM checkout, purge GNOME, assemble the casper live
# medium with Calamares, build the hybrid ISO, then smoke-test BIOS and UEFI
# boots under QEMU before anything reaches a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-suite:
        description: 'Ubuntu suite for the rootfs (codename; empty = config/flavor.conf default)'
        required: false
        default: ''
      hde-ref:
        description: 'NexWM/HDE ref to build (branch or tag; default main)'
        required: false
        default: 'main'
      skip-qemu:
        description: 'Skip the QEMU firmware smoke tests'
        type: boolean
        default: false
  schedule:
    # Weekly Monday-morning UTC run: the flavor requirement is to keep a
    # buildable, installable ISO current against the base archive.
    - cron: '0 6 * * 1'

permissions:
  contents: write   # release upload on tags

env:
  WORKDIR: /srv/nexwm-os-build

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    outputs:
      iso_name: ${{ steps.iso.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Restore the APT package cache
        # debootstrap + chroot apt download well over 1 GB per build; the
        # build stages download into $WORKDIR/apt-cache (debootstrap
        # --cache-dir, then a bind-mount over the chroot's apt archives), so
        # the cache can hand it across runs. Restore and save are split so
        # the save also happens when the build itself fails: during feature
        # iteration several runs in a row fail, and each would otherwise
        # throw away another GB of downloads. The key rolls when the base
        # suite input changes.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORKDIR }}/apt-cache
          key: apt-${{ runner.os }}-${{ github.event.inputs.base-suite || 'noble-default' }}-v1
          restore-keys: |
            apt-${{ runner.os }}-${{ github.event.inputs.base-suite || 'noble-default' }}-
            apt-${{ runner.os }}-

      - name: Build the ISO (debootstrap + HDE + GNOME purge + Calamares + xorriso)
        run: |
          sudo env NEXWM_BASE_SUITE="${{ github.event.inputs.base-suite }}" \
                   HDE_REPO_REF="${{ github.event.inputs.hde-ref || 'main' }}" \
                   bash build.sh --fresh

      - name: Capture stage logs
        # The ISO-adjacent diagnostics are useful when the build fails, but
        # they must never be able to fail the run themselves (e.g. when the
        # Actions artifact storage quota is exhausted).
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/logs/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the APT package cache
        # apt (root, through the chroot bind) leaves a root-owned lock file
        # and a partial dir inside the cache; the tar of the save action runs
        # as the runner user and cannot read them. Tidy first. This also
        # covers builds that die before the build script's own eviction.
        if: always()
        run: |
          sudo rm -f "${{ env.WORKDIR }}/apt-cache/lock"
          sudo rm -rf "${{ env.WORKDIR }}/apt-cache/partial"
          sudo chmod -R a+rX "${{ env.WORKDIR }}/apt-cache" || true
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.WORKDIR }}/apt-cache
          key: apt-${{ runner.os }}-${{ github.event.inputs.base-suite || 'noble-default' }}-v1

      - name: Identify the built ISO
        id: iso
        run: |
          ls -lh "$WORKDIR/out"
          iso_path=$(ls -1 "$WORKDIR"/out/*.iso | head -n1)
          echo "name=$(basename "$iso_path")" >> "$GITHUB_OUTPUT"

      # ISOs are far larger than any private-repo artifact allowance, so they
      # travel through a rolling "nightly" RELEASE instead of Actions
      # artifacts: release assets do not count against the Actions storage
      # quota. The QEMU job and (on tags) the real release download it back
      # from here.
      - name: Publish the ISO to the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          # The ISO lives in $WORKDIR/out, which is not a git checkout, so gh
          # cannot infer the repository from the working directory.
          GH_REPO: ${{ github.repository }}
          ISO_NAME: ${{ steps.iso.outputs.name }}
        run: |
          cd "$WORKDIR/out"
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
              --target "$GITHUB_SHA" \
              --title "NexWM OS nightly" \
              --notes "Automated development build of commit $GITHUB_SHA. Pre-release: the QEMU firmware smoke tests have not run for this ISO yet." \
              --prerelease
          gh release upload nightly "$ISO_NAME" "$ISO_NAME.sha256" --clobber

  qemusmoke:
    name: QEMU smoke (BIOS + UEFI)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build
    if: ${{ github.event.inputs.skip-qemu != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and firmware
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              qemu-system-x86 qemu-utils ovmf
          # Hosted runners expose /dev/kvm but not to the runner user; open it up
          # (the documented udev rule) so QEMU does not fall back to slow TCG.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: the TCG fallback will be used (slower, still valid)"

      - name: Download the ISO from the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download nightly --pattern "*.iso"
          gh release download nightly --pattern "*.sha256"
          ls -l

      - name: Run the firmware smoke tests
        run: |
          chmod +x test/qemu-smoke.sh
          ./test/qemu-smoke.sh "${{ needs.build.outputs.iso_name }}" both

      - name: Upload serial logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs-${{ github.run_id }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Attach the ISO to the tag release
    runs-on: ubuntu-24.04
    needs: [build, qemusmoke]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.build.result == 'success' && needs.qemusmoke.result == 'success'

    steps:
      - name: Download the ISO from the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download nightly --pattern "*.iso"
          gh release download nightly --pattern "*.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            *.sha256
          generate_release_notes: true
