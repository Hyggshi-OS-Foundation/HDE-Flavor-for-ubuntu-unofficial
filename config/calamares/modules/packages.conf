---
# packages.conf — package operations run inside the *target* system right
# before the installer finishes.
#
# Removing the live machinery (casper, live-*, zram-config, cifs-utils) is NOT
# done here any more: Calamares' "remove" runs ONE `apt-get remove <names>` and
# apt aborts the whole command (exit 100, "Installation Failed: Package Manager
# error") as soon as a single name is not an installed/known package, which is
# the case for most of that list on this image. shellprocess
# nexwm-os-live-packages removes only what is really installed instead.
#
# update_db is off: `apt-get update` inside the target needs a network, and a
# failing update would abort an otherwise good offline installation. The
# language packs below are best effort (try_install never aborts) and only
# succeed when the target already knows the packages.

update_db: false
backend: apt
operations:
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
