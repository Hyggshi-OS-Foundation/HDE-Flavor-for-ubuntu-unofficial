---
# packages.conf — package operations run inside the *target* system right
# before the installer finishes. It removes the live machinery so an
# installed NexWM OS is a normal system, then installs the language support
# for the locale the user picked (best effort: try_install never aborts).

update_db: true
backend: apt
operations:
  - remove:
      - "^live-*"
      - casper
      - zram-config
      - cifs-utils
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
