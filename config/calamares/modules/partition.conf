---
# partition.conf — automatic partitioning defaults for NexWM OS.
# Mirrors the layout Ubuntu flavors (Lubuntu, Ubuntu MATE) use so UEFI/BIOS,
# LUKS and swap choices behave exactly as on the official spin family.
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - file
initialSwapChoice: file
drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
partitionLayout:
    - name: "nexwm_boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 4G
    - name: "nexwm_os"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
