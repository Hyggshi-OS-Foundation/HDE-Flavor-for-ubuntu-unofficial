# nexwm-os-live-cleanup — shellprocess run at the very end, on the *target*:
# it strips the live-session machinery the squashed medium carried over so an
# installed NexWM OS boots like a normal install (no casper auto-login, no
# smoke-check unit, no casper.conf). @ROOT@ is the mounted target root.
# @ROOT@ is the mounted target root as seen from the live system, so this
# must run on the host (dontChroot: true); inside the chroot those paths do not
# exist and every `rm -f` below would silently do nothing.
dontChroot: true
script: |
    set -e
    rm -f @ROOT@/etc/systemd/system/nexwm-os-live-autologin.service
    rm -f @ROOT@/etc/systemd/system/nexwm-os-live-check.service
    rm -f @ROOT@/etc/systemd/system/graphical.target.wants/nexwm-os-live-check.service
    rm -f @ROOT@/etc/systemd/system/multi-user.target.wants/nexwm-os-live-autologin.service
    rm -f @ROOT@/etc/sddm.conf.d/99-nexwm-os-live-autologin.conf
    rm -f @ROOT@/usr/lib/nexwm-os/live-autologin
    rm -f @ROOT@/usr/bin/nexwm-os-live-check
    rm -f @ROOT@/etc/casper.conf
    rm -f @ROOT@/etc/nexwm-os.txt
    exit 0
