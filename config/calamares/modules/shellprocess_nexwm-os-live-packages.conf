---
# nexwm-os-live-packages — runs INSIDE the target (chroot): purge the live
# session packages that are actually installed. Packages that are not installed
# are simply skipped, so this can not fail the way a fixed
# `apt-get remove casper zram-config cifs-utils ^live-*` does.
dontChroot: false
timeout: 600
script:
    - command: |
        set -u
        pkgs=$(dpkg-query -W -f='${db:Status-Status} ${Package}\n' 2>/dev/null \
            | awk '$1 == "installed" && ($2 == "casper" || $2 == "zram-config" || $2 == "cifs-utils" || $2 ~ /^live-/) { print $2 }')
        if [ -n "$pkgs" ]; then
            echo "removing live packages: $pkgs"
            DEBIAN_FRONTEND=noninteractive apt-get --purge -q -y remove $pkgs || echo "warning: could not remove: $pkgs"
        else
            echo "no live packages to remove"
        fi
        exit 0
