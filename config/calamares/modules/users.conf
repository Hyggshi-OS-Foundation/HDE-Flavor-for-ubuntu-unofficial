---
# users.conf — the first user created on the installed system.
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - name: sambashare
      must_exist: false
      system: true
    - sudo
passwordRequirements:
    minLength: 1
    maxLength: -1
# Explicitly set the shell instead of deferring to Calamares: Ubuntu-derived
# platforms expect /bin/bash.
user:
  shell: /bin/bash
  forbidden_names: [ root ]
allowActiveDirectory: true
