---
# welcome.conf — requirements and notes on the installer welcome page.
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
showDonateUrl:          false

requirements:
    requiredStorage:    8
    requiredRam:        1.0
    internetCheckUrl:   https://github.com/Hyggshi-OS-Research-Technology/NexWM

    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
        - storage
        - ram

# GeoIP is effectively disabled by setting style to "none"; the user picks
# language and location deliberately.
geoip:
    style:  "none"
