---
# settings.conf for NexWM OS (Calamares).
# Derived from the module sequence Ubuntu flavors (Lubuntu / Ubuntu MATE)
# ship in calamares-settings-ubuntu, trimmed to upstream modules only so the
# flavor does not depend on any private Calamares module.

modules-search: [ local ]

instances:
- id: nexwm-os-live-cleanup
  module: shellprocess
  config: shellprocess_nexwm-os-live-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - packages
  - shellprocess@nexwm-os-live-cleanup
  - umount
- show:
  - finished

branding: nexwm-os
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
