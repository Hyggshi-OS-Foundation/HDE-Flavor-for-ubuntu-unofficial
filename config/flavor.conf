# flavor.conf — single source of truth for every NexWM OS ISO build.
# Sourced by the build stages and the workflow; all other files may reference
# the values defined here.

# --- Flavor identity ---------------------------------------------------------
FLAVOR_NAME="NexWM OS"
FLAVOR_ID="nexwmos"                 # /etc/os-release ID (no dashes)
FLAVOR_PRETTY="NexWM OS"            # shown to users in About, installer, boot menu
FLAVOR_ISO_LABEL="NEXWMOS"          # ISO 9660 volume label (<= 32 chars, no spaces)

# --- Upstream desktop --------------------------------------------------------
# HDE (the Hyggshi Desktop Environment; repository name "NexWM"): the panel,
# files, settings, NexWM window manager and the SDDM theme all come from it.
HDE_REPO_URL="https://github.com/Hyggshi-OS-Research-Technology/NexWM"
HDE_REPO_REF="main"                 # branch or tag to build HDE from
HDE_BUILD_SCRIPT="packaging/hyggshi-os/build-nexwm.sh"
HDE_DEFAULT_SESSION="nexwm"         # SDDM session file id: HDE with the NexWM WM

# Live session identity (see scripts/casper: FLAVOUR, when set, protects the
# USERNAME/HOST choice below from being overwritten from /cdrom/.disk/info).
LIVE_USERNAME="ubuntu"
LIVE_USERFULLNAME="NexWM OS Live session user"
LIVE_HOST="nexwm-os"
LIVE_FLAVOUR="nexwm-os"             # casper.conf FLAVOUR (keeps LIVE_* held)

# --- Ubuntu base -------------------------------------------------------------
# Newest stable LTS by default (the flavor-maintainer friendly choice; Ubuntu
# requires flavors to keep a buildable/installable ISO on release cadence).
# "AUTO_LTS" resolves the newest LTS at build time (suites below, newest
# first, probed in order); a fixed codename may also be given (noble, ...).
UBUNTU_BASE="${UBUNTU_BASE:-AUTO_LTS}"
UBUNTU_LTS_SUITES="noble"           # extend when a new LTS ships (e.g. "noble focal")
APT_MIRROR="http://archive.ubuntu.com/ubuntu"
APT_COMPONENTS="main restricted universe multiverse"

# Linux guest memory the ISO console smoke test needs (the live desktop, not
# the installer, is what is verified headlessly).
SMOKE_USERSPACE_TIMEOUT="900"       # seconds the desktop gets to appear
DESKTOP_MARKER="NEXWMOS_SMOKE_OK"   # printed on serial when the desktop is up

# --- Paths (filled by build.sh; defaults relative to the repo) ---------------
SRC_DIR="${SRC_DIR:-$REPO_DIR}"     # this repository
WORK_DIR="${WORK_DIR:-/srv/nexwm-os-build}"
